name: Deploy Interactive Lean 4 Proof Blueprint (GitHub Pages)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Static Research Portal & 78-Theorem Blueprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate static _site/ portal via scripts/build_blueprint.py
        run: python3 scripts/build_blueprint.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

name: Release Artifacts & SLSA Attestation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build Release Checksums, SLSA v4 Provenance & Notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tagged artifacts and generate SHA256SUMS
        run: |
          sha256sum dist/Donahue_2026_cellulogonic_mecha.pdf dist/arxiv_submission.tar.gz CHECKSUMS.sha256 results/lean4-audit.txt results/citation-audit.json > SHA256SUMS
          cat SHA256SUMS
      - name: Upload release checksums artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-sha256sums
          path: SHA256SUMS
      - name: Attest release build provenance (SLSA v4)
        uses: actions/attest-build-provenance@v4
        continue-on-error: true
        with:
          subject-path: |
            dist/Donahue_2026_cellulogonic_mecha.pdf
            dist/arxiv_submission.tar.gz
            CHECKSUMS.sha256
            SHA256SUMS

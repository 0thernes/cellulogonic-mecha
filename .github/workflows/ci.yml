name: Cellulogonic Mecha CI — Build, Falsification & Lean 4 Proof Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linux-c11-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux ELF64 & Run 24-Gate Falsification Suite
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh
      - name: Run Deterministic Cross-Kernel Parity Benchmark
        run: |
          ./bin/cellulogonic_linux bench --epochs 300 --size 32 --seed 5000

  lean4-formal-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan & Lean v4.35.0
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Build Lean 4 Proof Suite & Strict Axiom Allowlist Audit
        working-directory: lean
        run: |
          lake build
          lake env lean CellulogonicProofs.lean | tee ../lean4-ci-audit.txt
          python3 - ../lean4-ci-audit.txt <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8").read()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          matches = re.findall(r"'([^']+)'\s+(does not depend on any axioms|depends on axioms:\s*\[([^\]]*)\])", text)
          if len(matches) < 58:
              sys.exit(f"ERROR: expected >= 58 audited theorems, found {len(matches)}")
          for name, _, axs in matches:
              for ax in [a.strip() for a in axs.split(",") if a.strip()]:
                  if ax not in allowed:
                      sys.exit(f"ERROR: forbidden Lean axiom '{ax}' detected in {name}!")
          print(f"Strict Lean 4 Axiom Audit PASSED ({len(matches)} theorems strictly within {{propext, Classical.choice, Quot.sound}})")
          PY

  verify-paper:
    name: AMS-LaTeX White Paper & arXiv Bundle Build (Tectonic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tectonic TeX engine
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/tectonic
          tectonic --version
      - name: Compile paper/main.tex and verify dist/arxiv_submission.tar.gz standalone
        run: |
          mkdir -p /tmp/pdf-out /tmp/arxiv-check/out
          tectonic -X compile paper/main.tex --outdir /tmp/pdf-out --keep-logs
          test -s /tmp/pdf-out/main.pdf
          tar -xzf dist/arxiv_submission.tar.gz -C /tmp/arxiv-check
          tectonic -X compile /tmp/arxiv-check/main.tex --outdir /tmp/arxiv-check/out
          test -s /tmp/arxiv-check/out/main.pdf

version = 1
SPDX-PackageName = "cellulogonic-mecha"
SPDX-PackageSupplier = "Alexander Stephen Donahue <0_0@0thernes.art>"
SPDX-PackageDownloadLocation = "https://github.com/0thernes/cellulogonic-mecha"

[[annotations]]
path = [
  "VERSION",
  "NOTICE",
  "CHECKSUMS.sha256",
  "data/**",
  "results/**",
  "lean/lean-toolchain",
  "lean/lake-manifest.json",
  "lean/lakefile.toml",
  "lean/comparator.json",
  "lean/formalization.yaml",
  "repo.yaml",
  "CITATION.cff",
  "CITATION.bib",
  ".zenodo.json",
  ".editorconfig",
  ".gitattributes",
  ".gitignore",
  ".env.example",
  ".github/**",
  ".cursor/**",
  "justfile",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Alexander Stephen Donahue <0_0@0thernes.art>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
  "*.md",
  "llms.txt",
  "llms-full.txt",
  "docs/**",
  "paper/**",
  "dist/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Alexander Stephen Donahue <0_0@0thernes.art>"
SPDX-License-Identifier = "CC-BY-4.0"

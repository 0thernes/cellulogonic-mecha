fidelity:
  divergences: >-
    Lean 4.35.0 verifies exact integer/polynomial abstractions (e.g., cleared-denominator
    Q(V,L) = 100 V^2 / L^3, 3*R^2 and R^3 spherical proxies, integer Chemoton stoichiometry,
    exact C11 Hippo TF7/Frohlich/CPG integer recurrences), whereas C11 runtime code
    (src/cellular_world.c, src/chemoton_physics.c) also executes continuous int32_t
    fixed-point 3D positions (pos_nm[3]), AVX2/scalar conserved diffusion, Philox4x32-10
    PRNG draws, spatial hashing, and float64/float32 telemetry/COVI/112-trait projections
    outside the Lean kernel. See docs/statement-fidelity.md for the full row-by-row matrix.

review:
  status: "self-assessed"
  notes: >-
    Not externally peer-reviewed. Accepted by six kernel checks in sandboxed bubblewrap
    on Ubuntu CI (Lean default and paranoid modes, lean4lean, nanoda_bin,
    con-leche --verified, con-ron --verified; two of the six use the Lean reference kernel)
    via lake check --paranoid and lake comparator --config comparator.json --paranoid,
    plus live negative tamper rejection testing.
